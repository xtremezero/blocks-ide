<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50 text-slate-800 select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blocks IDE</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Custom Editor CSS -->
  <link rel="stylesheet" href="css/editor.css">
</head>
<body class="h-full flex flex-col items-center justify-center bg-gradient-to-b from-slate-50 via-slate-100 to-slate-200 p-4 font-sans">

  <main class="flex flex-col items-center justify-center max-w-4xl w-full text-center">
    <!-- Title -->
    <h1 class="text-4xl sm:text-6xl font-extrabold text-slate-900 tracking-tight mb-10 sm:mb-14 bg-clip-text text-transparent bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600">
      Blocks IDE
    </h1>

    <!-- 4 Buttons Grid -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 sm:gap-6 w-full max-w-3xl">
      <!-- C Button -->
      <a href="index C.html" class="group flex flex-col items-center justify-center p-6 sm:p-8 rounded-2xl bg-white border border-slate-200 hover:border-blue-500 shadow-sm hover:shadow-xl transition-all duration-200 hover:-translate-y-1">
        <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 text-white font-extrabold text-xl sm:text-2xl flex items-center justify-center shadow-lg shadow-blue-500/25 group-hover:scale-110 transition-transform">
          C
        </div>
        <span class="mt-4 font-bold text-slate-800 text-lg group-hover:text-blue-600 transition-colors">C</span>
      </a>

      <!-- C++ Button -->
      <a href="index C++.html" class="group flex flex-col items-center justify-center p-6 sm:p-8 rounded-2xl bg-white border border-slate-200 hover:border-cyan-500 shadow-sm hover:shadow-xl transition-all duration-200 hover:-translate-y-1">
        <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-gradient-to-tr from-cyan-600 to-blue-500 text-white font-extrabold text-xl sm:text-2xl flex items-center justify-center shadow-lg shadow-cyan-500/25 group-hover:scale-110 transition-transform">
          C++
        </div>
        <span class="mt-4 font-bold text-slate-800 text-lg group-hover:text-cyan-600 transition-colors">C++</span>
      </a>

      <!-- Haxe Button -->
      <a href="index haxe.html" class="group flex flex-col items-center justify-center p-6 sm:p-8 rounded-2xl bg-white border border-slate-200 hover:border-orange-500 shadow-sm hover:shadow-xl transition-all duration-200 hover:-translate-y-1">
        <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-gradient-to-tr from-orange-500 to-amber-500 text-white font-extrabold text-xl sm:text-2xl flex items-center justify-center shadow-lg shadow-orange-500/25 group-hover:scale-110 transition-transform">
          HX
        </div>
        <span class="mt-4 font-bold text-slate-800 text-lg group-hover:text-orange-600 transition-colors">Haxe</span>
      </a>

      <!-- Lua Button -->
      <a href="index lua.html" class="group flex flex-col items-center justify-center p-6 sm:p-8 rounded-2xl bg-white border border-slate-200 hover:border-sky-500 shadow-sm hover:shadow-xl transition-all duration-200 hover:-translate-y-1">
        <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-gradient-to-tr from-blue-700 to-sky-500 text-white font-extrabold text-xl sm:text-2xl flex items-center justify-center shadow-lg shadow-sky-500/25 group-hover:scale-110 transition-transform">
          Lua
        </div>
        <span class="mt-4 font-bold text-slate-800 text-lg group-hover:text-sky-600 transition-colors">Lua</span>
      </a>
    </div>
  </main>

</body>
</html>
