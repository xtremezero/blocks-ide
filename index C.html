<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50 text-slate-800">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block-C | Visual C Block IDE</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Blockly Libraries -->
  <script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
  <script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
  <script src="https://unpkg.com/blockly/javascript_compressed.js"></script>
  <script src="https://unpkg.com/blockly/msg/en.js"></script>
  <!-- Highlight.js for Light Mode Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/languages/c.min.js"></script>
  <!-- Custom Editor CSS -->
  <link rel="stylesheet" href="css/editor.css">
</head>
<body class="h-full flex flex-col overflow-hidden select-none bg-slate-50">
  <!-- Dynamic Header Component -->
  <header id="appHeader"></header>

  <!-- Main Workspace & Code Generator View -->
  <main class="flex-1 flex overflow-hidden relative">
    <!-- Left Pane: Blockly Interactive Editor Canvas -->
    <div id="blocklyArea" class="flex-1 h-full relative">
      <div id="blocklyDiv" class="absolute inset-0"></div>
    </div>

    <!-- Divider Bar -->
    <div class="w-1 bg-slate-200 border-x border-slate-300 cursor-col-resize"></div>

    <!-- Right Pane: Real-time Generated C Source Code -->
    <div class="w-[420px] lg:w-[480px] h-full bg-slate-50 flex flex-col border-l border-slate-200 shrink-0">
      <!-- Code Bar Header -->
      <div class="h-10 bg-slate-100 border-b border-slate-200 px-4 flex items-center justify-between text-xs text-slate-600 font-mono">
        <div class="flex items-center space-x-2">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <span class="text-slate-800 font-medium">source.c</span>
          <span class="text-[10px] text-slate-500 uppercase tracking-wider">Generated</span>
        </div>

        <button onclick="copyCode()" id="copyBtn" class="hover:text-slate-900 px-2.5 py-1 bg-white hover:bg-slate-100 text-slate-700 rounded border border-slate-300 transition flex items-center gap-1 shadow-sm">
          <svg id="copyIcon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 002 2h2a2 2 0 002 2m0 0h2a2 2 0 002 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
          <span id="copyText">Copy Code</span>
        </button>
      </div>

      <!-- Code Output Area -->
      <div class="flex-1 overflow-auto p-4 bg-white text-slate-800">
        <pre><code id="codeOutput" class="language-c text-xs leading-relaxed font-mono">/* Generated C Code will appear here */</code></pre>
      </div>
    </div>
  </main>

  <!-- Blockly Toolbox Specification XML for C -->
  <xml id="toolbox" style="display: none">
    <category name="Program Structure" colour="#4C97FF">
      <block type="c_main"></block>
      <block type="c_include_std"></block>
      <block type="c_include"></block>
      <block type="c_printf"></block>
    </category>

    <category name="Variables & Data" colour="#59C059">
      <block type="c_declare"></block>
      <block type="c_struct_union_enum"></block>
      <block type="c_typedef"></block>
      <block type="c_sizeof"></block>
      <block type="c_number"></block>
      <block type="c_string"></block>
      <block type="std_const_null"></block>
      <block type="std_const_exit_success"></block>
      <block type="std_const_exit_failure"></block>
      <block type="std_const_m_pi"></block>
      <block type="std_const_stdin"></block>
      <block type="std_const_stdout"></block>
    </category>

    <category name="Control Flow" colour="#FFAB19">
      <block type="c_if"></block>
      <block type="c_switch"></block>
      <block type="c_case"></block>
    </category>

    <category name="Loops" colour="#FF6680">
      <block type="c_while"></block>
      <block type="c_do_while"></block>
      <block type="c_for"></block>
    </category>

    <category name="Jumps (Keywords)" colour="#FFBF00">
      <block type="c_break"></block>
      <block type="c_continue"></block>
      <block type="c_return"></block>
      <block type="c_goto"></block>
      <block type="c_label"></block>
    </category>

    <category name="Operators" colour="#9966FF">
      <block type="c_math"></block>
      <block type="c_compare"></block>
      <block type="c_logic"></block>
    </category>

    <category name="Functions" colour="#9966FF" custom="PROCEDURE"></category>
    <category name="Variables" colour="#59C059" custom="VARIABLE"></category>
  </xml>

  <!-- Core IDE Utilities and C Generator -->
  <script src="js/core/ide-core.js"></script>
  <script src="js/generators/c-generator.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      initIDE(cLangConfig);
    });
  </script>
</body>
</html>
